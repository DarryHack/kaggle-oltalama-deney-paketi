name: Fetch exact Kaggle research input

on:
  push:
    branches: ["analysis/kaggle-input-20261114"]
    paths: [".github/workflows/fetch-kaggle-input.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-input:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public dataset client
        run: python -m pip install 'kagglehub>=0.3,<1'
      - name: Download the specified dataset only
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import hashlib, importlib.metadata, json, os, pathlib, shutil
          from datetime import datetime, timezone
          import kagglehub
          handle = 'naserabdullahalam/phishing-email-dataset'
          root = pathlib.Path(kagglehub.dataset_download(handle))
          matches = list(root.rglob('phishing_email.csv'))
          if len(matches) != 1:
              raise RuntimeError(f'Expected exactly one phishing_email.csv, found {len(matches)}')
          source = matches[0]
          output = pathlib.Path('kaggle_input')
          output.mkdir(exist_ok=False)
          destination = output / 'phishing_email.csv'
          shutil.copyfile(source, destination)
          digest = hashlib.sha256()
          with destination.open('rb') as stream:
              for block in iter(lambda: stream.read(1024 * 1024), b''):
                  digest.update(block)
          manifest = {
              'dataset_handle': handle,
              'dataset_url': 'https://www.kaggle.com/datasets/' + handle,
              'download_method': 'kagglehub.dataset_download, no alternative corpus',
              'resolved_cache_path': str(source),
              'filename': destination.name,
              'file_bytes': destination.stat().st_size,
              'sha256': digest.hexdigest(),
              'downloaded_utc': datetime.now(timezone.utc).isoformat(),
              'kagglehub_version': importlib.metadata.version('kagglehub'),
              'github_run_id': os.environ.get('GITHUB_RUN_ID'),
              'github_commit': os.environ.get('GITHUB_SHA'),
              'training_performed_by_this_workflow': False
          }
          (output / 'source_manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          print(json.dumps(manifest, indent=2))
          PY
      - name: Store input for authorized analysis
        uses: actions/upload-artifact@v4
        with:
          name: exact-kaggle-research-input
          path: kaggle_input/
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
